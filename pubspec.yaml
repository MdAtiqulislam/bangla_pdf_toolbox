name: bangla_pdf_toolbox
description: "Bangla PDF ToolBox - Clean Architecture PDF Tools application for mobile."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  pdf: ^3.11.1
  printing: ^5.13.2
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  image: ^4.5.4
  google_mobile_ads: ^5.2.0
  share_plus: ^10.1.3
  open_filex: ^4.5.0
  connectivity_plus: ^6.1.3
  permission_handler: ^12.0.0+1
  syncfusion_flutter_pdf: ^28.2.9
  syncfusion_flutter_pdfviewer: ^28.2.9
  cunning_document_scanner: ^3.0.1
  app_links: ^6.3.4
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
